name: .NET

on:
  push:
    branches: [ master ]

  workflow_dispatch:

jobs:
  build:
    env:
      ProjectName: PagerDuty

    runs-on: windows-latest

    steps:
    - name: Unfuck Git
      run: git config set --global core.autocrlf false

    - name: Clone
      uses: actions/checkout@v6

    - name: Initialize test reporting
      uses: testspace-com/setup-testspace@5fc620521eddeba83c1c0dd58f5a524adf474c93
      with:
        domain: ${{github.repository_owner}}
        
    - name: Restore
      run: dotnet restore PagerDuty -p:Configuration=Release

    - name: Build and pack
      run: |
        $binPath = [System.IO.Path]::GetFullPath("./bin/")
        New-Item $binPath -ItemType Directory -ErrorAction SilentlyContinue

        dotnet build ${{ env.ProjectName }} --configuration Release --no-restore
        dotnet pack ${{ env.ProjectName }} --configuration Release --no-build --output $binPath

        dotnet restore ${{ env.ProjectName }}.Webhooks --source "https://api.nuget.org/v3/index.json" --source $binPath -p:Configuration=Release
        dotnet build ${{ env.ProjectName }}.Webhooks --configuration Release --no-restore
        dotnet pack ${{ env.ProjectName }}.Webhooks --configuration Release --no-build --output $binPath

    - name: Test
      run: |
        dotnet test --verbosity normal --configuration Release --collect:"XPlat Code Coverage" --settings Tests/coverlet.runsettings --logger trx
        Out-File -InputObject "TEST_EXIT_CODE=$LASTEXITCODE" -FilePath $env:GITHUB_ENV -Append -Encoding UTF8
        Get-ChildItem .\Tests\TestResults -Filter coverage.info -Depth 1 | ForEach-Object { Move-Item -Path $_.FullName -Destination ([System.IO.Path]::ChangeExtension($_.FullName, "lcov")) }
        exit 0

    - name: Upload test report
      run: testspace Tests/TestResults/*.trx

    - name: Upload coverage
      uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        format: lcov

    - name: Stop if tests failed
      run: exit $env:TEST_EXIT_CODE

    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ProjectName }}.nupkg
        path: /bin/*.*nupkg
        if-no-files-found: error